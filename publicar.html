<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar o serviço</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Publicar Anúncio</h1>

        <input id="nome" placeholder="Seu nome">

        <input id="telefone" placeholder="WhatsApp">

        <select id="categoria">

            <option>Construção</option>
            <option>Elétrica</option>
            <option>Informática</option>
            <option>Aulas Particulares</option>
            <option>Limpeza</option>
            <option>Jardinagem</option>
            <option>Vaga de Emprego</option>
            <option>Outros</option>

        </select>

<label for="cidade">Cidade do anúncio</label>

<select id="cidade" required>
    <option value="Reserva">Reserva - PR</option>
    <option value="Ponta Grossa">Ponta Grossa - PR</option>
    <option value="Cândido de Abreu">Cândido de Abreu - PR</option>
    <option value="Telêmaco Borba">Telêmaco Borba - PR</option>
</select>

        <input id="titulo" placeholder="Título do serviço">

        <textarea id="descricao" placeholder="Descreva o que você precisa">
</textarea>

        <button id="btnPublicar">
            Publicar anúncio
        </button>

        <a href="index.html">
            Voltar
        </a>

    </div>
    <script type="module" src="publicar.js">
    </script>

</body>

</html>
